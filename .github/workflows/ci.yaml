name: CI (fastapi-demo)

on:
  push:
    branches: [main]                  # only on pushes to main...
    paths:
      - "fastapi-demo/**"             # ...that change the app (or this workflow)
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]                  # and on PRs targeting main (the pre-merge gate)
    paths:
      - "fastapi-demo/**"
  workflow_dispatch:                  # or manually (Actions tab "Run workflow", or gh CLI)

defaults:
  run:
    working-directory: fastapi-demo   # all `run:` steps execute inside the demo folder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: |
          pwd
          ls -la
      - run: pip install flake8
      - run: flake8 app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    name: Build image (verify it containerises)
    runs-on: ubuntu-latest
    needs: [lint, test]               # gate: only build if lint AND tests passed
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fastapi-demo:${{ github.sha }} .
