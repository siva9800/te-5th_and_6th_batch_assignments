apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: app1-rs
  labels:
    app: web
    created-by: Gowthami

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web
        created-by: Gowthami

    spec:
      containers:
      - name: nginx
        image: nginx:1.25